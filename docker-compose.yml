services:
  relocate-api:
    container_name: relocate-api
    restart: always
    image: node:20.10.0
    ports:
      - 7001:7004
    volumes:
      - ./:/usr/src/relocate
    working_dir: /usr/src/relocate

    networks:
      - monorepo-network

    # FOR PORDUCTION
    command: bash -c "rm -rf dist && npm install && npm run build && npm run start:prod"

  relocate-batch:
    container_name: relocate-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 7002:7005
    volumes:
      - ./:/usr/src/relocate
    working_dir: /usr/src/relocate

    networks:
      - monorepo-network

    # FOR PORDUCTION
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
